name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll 2>/dev/null || touch _site/.nojekyll
          if [ -f _headers ]; then cp _headers _site/_headers; fi
          # Same notice for any old deep links
          cp index.html _site/404.html
          cp index.html _site/manual.html
          cp index.html _site/equation-index.html
          cp index.html _site/poster.html
          cp index.html _site/tests.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
