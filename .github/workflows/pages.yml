name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  checks: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Prepare static site
        run: |
          npm run build:bundle
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='artifacts' \
            --exclude='shots' \
            --exclude='_site' \
            --exclude='*.log' \
            --exclude='package-lock.json' \
            ./ _site/
          # Ensure Jekyll never processes the artifact (Actions path is already static).
          touch _site/.nojekyll
          node scripts/prepare-site.mjs _site
          node -e "
            const s=require('./_site/asset-stamp.json');
            if (!s.docsAssets || String(s.docsAssets).length < 8) {
              console.error('asset-stamp.json missing docsAssets', s);
              process.exit(1);
            }
            console.log('docsAssets', s.docsAssets, 'microCss', s.microCss);
          "

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

  pages-check:
    name: pages-check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Neutron strip on deployed Pages
        id: pages_strip
        env:
          PAGES_SKIP_WAIT: '1'
          PAGES_SHA: ${{ github.sha }}
          PAGES_URL: https://otas0.github.io/immspfee/
          PAGES_HONORS_HEADERS: '1'
        run: |
          SHORT=$(echo "$PAGES_SHA" | cut -c1-7)
          export PAGES_SHA="$SHORT"
          npm run test:pages

      - name: Publish pages-check run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.pages_strip.outcome }}' === 'success';
            const short = context.sha.slice(0, 7);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'pages-check',
              head_sha: context.sha,
              status: 'completed',
              conclusion: ok ? 'success' : 'failure',
              output: {
                title: ok ? `Pages neutron strip ok (${short})` : `Pages neutron strip failed (${short})`,
                summary: ok
                  ? `Deployed ?v=${short}&lang=en matches the local narrow strip.`
                  : `See the pages-check job log for formula / strip / microscope mismatches.`,
              },
            });

  microscope-webgl3d:
    name: microscope-webgl3d
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cold-start lab-microscope3d must reach webgl3d
        id: micro_webgl
        env:
          PAGES_URL: https://otas0.github.io/immspfee/
          PAGES_SHA: ${{ github.sha }}
        run: |
          SHORT=$(echo "$PAGES_SHA" | cut -c1-7)
          export PAGES_SHA="$SHORT"
          mkdir -p shots artifacts
          node scripts/pages-microscope-webgl.mjs

      - name: Upload microscope fail screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: microscope-webgl3d-${{ github.sha }}
          path: |
            shots/pages-micro-*.png
            artifacts/pages-micro-*.json
          if-no-files-found: ignore
