name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-pw1.48

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install chromium --with-deps

      # Cache hit already has browser binaries; skip install-deps (it has hung runners).
      - name: Confirm Playwright Chromium (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 2
        run: npx playwright install chromium

      - name: Unit tests
        id: unit_tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/npm-test.log

      - name: Annotate glyphRows drift
        if: failure() && steps.unit_tests.outcome == 'failure'
        shell: bash
        run: |
          key=$(grep -oE 'first key [^[:space:]]+' artifacts/npm-test.log 2>/dev/null | head -1 | sed 's/^first key //' || true)
          if [ -n "$key" ]; then
            echo "::error title=glyphRows.js drift::first key $key — regenerate with npm run gen:glyphs and commit js/i18n/glyphRows.js"
          fi
          if grep -qE 'tick still reads params\.t|missing hall\(\)|missing quantumHall\(\)' artifacts/npm-test.log 2>/dev/null; then
            echo "::error title=Hall / quantumHall gate::topicModel hall() and quantumHall() must stay separate and must not read params.t / P(..., 't')"
          fi

      - name: Forbid on-stage assumption / caveat strips
        run: node scripts/assert-no-stage-strips.mjs

      - name: Sidebar domains stay collapsed by default
        run: node scripts/assert-folds-default.mjs

      - name: models-en zero Han leakage
        run: node scripts/assert-models-en.mjs

      - name: Lab poster — no sibling TE markers
        run: npm run sync:poster && npm run assert:poster

      - name: Schema coverage report
        run: npm run report:schema

      - name: Rebuild lab bundle for CI fingerprint
        run: |
          npm run build:bundle
          test -f js/bundle/meta.json || { echo "build:bundle left no js/bundle/meta.json"; exit 1; }
          test -f js/bundle/lab.js || { echo "build:bundle left no js/bundle/lab.js"; exit 1; }
          node -e "const m=require('./js/bundle/meta.json'); const outs=m&&m.outputs; if(!outs||!outs.length||!outs.some(o=>String(o.file||'').includes('lab.js'))){console.error('meta.json missing lab.js output',m); process.exit(1)} console.log('bundle meta ok', outs.map(o=>o.file).join(','))"

      - name: Start lab server
        run: |
          node scripts/dev-server.mjs &
          sleep 2

      - name: Lab poster A4 print smoke
        run: npm run test:poster

      - name: Pot regression
        run: npm run test:pot

      - name: Restore narrow-fail streak
        if: always()
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: artifacts/narrow-streak-cache
          key: narrow-streak-${{ github.run_id }}
          restore-keys: |
            narrow-streak-

      - name: Narrow-screen formula regression
        # Soft-fail once so micro contracts still run; two consecutive fails → hard fail below.
        id: narrow_regression
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run test:narrow 2>&1 | tee artifacts/narrow-regression.log
          echo "narrow-regression ok" >> artifacts/ci-summary.txt

      - name: Narrow regression streak / hard gate
        if: always()
        run: |
          mkdir -p artifacts artifacts/narrow-streak-cache
          STREAK=0
          if [ -f artifacts/narrow-streak-cache/narrow-fail-streak.json ]; then
            STREAK=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('artifacts/narrow-streak-cache/narrow-fail-streak.json','utf8')).over||0)}catch{console.log(0)}")
          fi
          if [ "${{ steps.narrow_regression.outcome }}" = "failure" ]; then
            STREAK=$((STREAK + 1))
            echo "narrow-regression FAILED (isolated; streak ${STREAK}/2) — see artifacts/narrow-regression.log" | tee -a artifacts/ci-summary.txt
          else
            STREAK=0
          fi
          node -e "require('fs').writeFileSync('artifacts/narrow-streak-cache/narrow-fail-streak.json', JSON.stringify({over:Number(process.argv[1]),at:new Date().toISOString()},null,2)+'\n')" "$STREAK"
          cp -f artifacts/narrow-streak-cache/narrow-fail-streak.json artifacts/narrow-fail-streak.json
          if [ "$STREAK" -ge 2 ]; then
            echo "narrow-regression hard-fail: failed ${STREAK} consecutive CI runs" | tee -a artifacts/ci-summary.txt
            exit 1
          fi

      - name: Save narrow-fail streak
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: artifacts/narrow-streak-cache
          key: narrow-streak-${{ github.run_id }}

      - name: Bundle retains microscope enter wiring
        run: |
          mkdir -p artifacts
          if grep -q 'focusCatalogModel' js/bundle/lab.js; then
            echo "bundle focusCatalogModel ok" | tee -a artifacts/ci-summary.txt
          else
            echo "bundle missing focusCatalogModel" | tee -a artifacts/ci-summary.txt
            exit 1
          fi

      - name: No browser monolith palettes.json
        run: |
          mkdir -p artifacts
          node scripts/assert-no-monolith-palette.mjs | tee -a artifacts/ci-summary.txt

      - name: Shell first-paint (factory steady models)
        timeout-minutes: 3
        run: npm run test:shell-first-paint

      - name: Shell chrome, DPR cap, and projector overlay
        id: shell_chrome
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run test:shell 2>&1 | tee artifacts/shell-chrome.log
          if ! grep -q 'menuHitTest ok' artifacts/shell-chrome.log; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "shell chrome FAILED — menuHitTest missing" >> artifacts/ci-summary.txt
            exit 1
          fi
          if ! grep -q 'menuHitTest wide ok' artifacts/shell-chrome.log; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "shell chrome FAILED — menuHitTest wide missing" >> artifacts/ci-summary.txt
            exit 1
          fi
          if ! grep -q 'menuHitTest webkit ok' artifacts/shell-chrome.log; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "shell chrome FAILED — menuHitTest webkit missing" >> artifacts/ci-summary.txt
            exit 1
          fi
          if grep -q 'shell chrome ok' artifacts/shell-chrome.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "shell chrome ok" >> artifacts/ci-summary.txt
            node -e "const s=require('./asset-stamp.json'); const fs=require('fs'); fs.appendFileSync('artifacts/ci-summary.txt', 'microscope-shell.css?v='+(s.microCss||s.css||'?')+'\n');"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "shell chrome FAILED" >> artifacts/ci-summary.txt
            exit 1
          fi

      - name: Restore previous micro-fps advisory (cross-run trend)
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: artifacts/micro-fps-cache
          key: micro-fps-prev-${{ github.run_id }}
          restore-keys: |
            micro-fps-prev-

      - name: Microscope denser-mesh FPS advisory (1280)
        # Advisory only — writes artifacts/micro-fps-advisory.json (+ trend).
        # fps390 in test:micro-camera is also advisory on CI (ubuntu GPU flake); local hard by default.
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p artifacts
          if [ -f artifacts/micro-fps-cache/micro-fps-advisory.json ]; then
            cp -f artifacts/micro-fps-cache/micro-fps-advisory.json artifacts/micro-fps-advisory.prev.json
          fi
          MICRO_FPS_MIN=25 npm run test:micro-fps 2>&1 | tee artifacts/micro-fps.log
          ls -la artifacts/micro-fps-advisory.json 2>&1 | tee -a artifacts/micro-fps.log || true
          if [[ -f artifacts/micro-fps-advisory.json ]]; then
            npm run test:micro-fps-trend 2>&1 | tee artifacts/micro-fps-trend.log
            mkdir -p artifacts/micro-fps-cache
            cp -f artifacts/micro-fps-advisory.json artifacts/micro-fps-cache/micro-fps-advisory.json
            echo "micro-fps advisory + trend ok" >> artifacts/ci-summary.txt
          else
            echo "micro-fps advisory missing json (check probe path shadow)" >> artifacts/ci-summary.txt
          fi

      - name: Save micro-fps cache (next run trend)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: artifacts/micro-fps-cache
          key: micro-fps-prev-${{ github.run_id }}

      - name: Microscope palette (activity ring vs DIN)
        run: |
          set -o pipefail
          npm run test:micro-palette 2>&1 | tee artifacts/micro-palette.log
          echo "micro-palette ok" >> artifacts/ci-summary.txt

      - name: Microscope knob contract (coarse/fine/stage/IPD, 1280 and 390)
        run: |
          set -o pipefail
          npm run test:micro-knobs 2>&1 | tee artifacts/micro-knobs.log
          npm run test:micro-knobs:390 2>&1 | tee artifacts/micro-knobs-390.log
          echo "micro-knobs ok" >> artifacts/ci-summary.txt

      - name: Microscope magenta activity-ring ROI (1280 and 390)
        run: |
          set -o pipefail
          npm run test:micro-magenta 2>&1 | tee artifacts/micro-magenta.log
          npm run test:micro-magenta:390 2>&1 | tee artifacts/micro-magenta-390.log
          echo "micro-magenta ok" >> artifacts/ci-summary.txt

      - name: Microscope oil blend
        run: |
          set -o pipefail
          npm run test:micro-oil 2>&1 | tee artifacts/micro-oil.log
          npm run test:micro-oil:390 2>&1 | tee artifacts/micro-oil-390.log
          echo "micro-oil ok" >> artifacts/ci-summary.txt

      - name: Microscope camera contract (WASD / blur / presets)
        run: |
          set -o pipefail
          npm run test:micro-camera 2>&1 | tee artifacts/micro-camera.log
          echo "micro-camera ok" >> artifacts/ci-summary.txt

      - name: Short SHA for artifacts
        if: always()
        id: short_sha
        run: echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Upload shell-chrome screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shell-chrome-screenshots-${{ steps.short_sha.outputs.sha }}
          path: shots/shell-*.png
          if-no-files-found: ignore

      - name: Cache reload and boot timing
        if: always()
        run: npm run test:boot && npm run test:boot-timing
        env:
          PAGES_URL: https://otas0.github.io/immspfee/

      - name: Locale key audit (advisory)
        if: always()
        id: locale_audit
        continue-on-error: true
        run: |
          mkdir -p artifacts
          npm run audit:locale-keys | tee artifacts/locale-key-audit-summary.txt
          UNUSED=$(node -e "const j=require('./artifacts/locale-key-audit.json'); console.log(j.unusedCount||0)")
          echo "unused=${UNUSED}" >> "$GITHUB_OUTPUT"
          echo "locale unusedCount=${UNUSED}" | tee -a artifacts/ci-summary.txt
          if [ "${UNUSED}" != "0" ]; then
            echo "advisory: locale unused keys — see artifacts/locale-key-audit.json (not a hard fail)"
          fi

      - name: Comment locale unused keys on PR
        # Always post on PRs so the path is exercised even when unusedCount=0.
        # Upsert: edit the prior bot comment with the marker instead of stacking.
        if: always() && github.event_name == 'pull_request' && steps.locale_audit.outputs.unused != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(node -e "
            const j=require('./artifacts/locale-key-audit.json');
            const n=j.unusedCount||0;
            const sample=(j.unused||[]).slice(0,24).map(k=>'- \`'+k+'\`').join('\\n');
            const marker='<!-- immspfee-locale-audit -->';
            const body = n
              ? (marker+'\\n### Locale key audit (advisory)\\n\\n\`unusedCount='+n+'\` — not a hard fail.\\n\\n'+sample+'\\n\\n_See \`artifacts/locale-key-audit.json\`._')
              : (marker+'\\n### Locale key audit (advisory)\\n\\n\`unusedCount=0\` — no static unused candidates.\\n\\n_See \`artifacts/locale-key-audit.json\`._');
            console.log(body);
          ")
          PR="${{ github.event.pull_request.number }}"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate \
            --jq '.[]|select(.user.login=="github-actions[bot]" and (.body|contains("immspfee-locale-audit")))|.id' \
            | head -n1 || true)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING}" -f body="$BODY"
            echo "Updated locale audit comment $EXISTING"
          else
            gh pr comment "$PR" --body "$BODY"
            echo "Created locale audit comment"
          fi

      - name: Pages network cold-start budget
        if: always()
        timeout-minutes: 5
        env:
          PAGES_URL: https://otas0.github.io/immspfee/
          PAGES_NETWORK_ASSERT: '1'
          PAGES_NETWORK_MAX_JS: '5'
        run: npm run test:pages-network

      - name: Restore previous Pages TTI (cross-run trend)
        if: always()
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: artifacts/pages-tti-cache
          key: pages-tti-prev-${{ github.run_id }}
          restore-keys: |
            pages-tti-prev-

      - name: Pages TTI SW blocked vs second hit
        if: always()
        timeout-minutes: 5
        env:
          PAGES_URL: https://otas0.github.io/immspfee/
          PAGES_TTI_HARD: '1'
          FIRST_HAND_SAMPLES: '5'
          FIRST_HAND_P95_RETRIES: '1'
          WARM_FIRST_HAND_P95_WARN_MS: '250'
        run: |
          mkdir -p artifacts
          if [ -f artifacts/pages-tti-cache/pages-tti-sw.json ]; then
            cp -f artifacts/pages-tti-cache/pages-tti-sw.json artifacts/pages-tti-sw.prev.json
          fi
          if [ -f artifacts/pages-tti-cache/pages-tti-warm-streak.json ]; then
            mkdir -p artifacts/pages-tti-cache
            cp -f artifacts/pages-tti-cache/pages-tti-warm-streak.json artifacts/pages-tti-warm-streak.json
          fi
          npm run test:pages-tti-sw
          WARM_FIRST_HAND_SOFT_FAIL=1 npm run test:pages-tti-trend
          mkdir -p artifacts/pages-tti-cache
          cp -f artifacts/pages-tti-sw.json artifacts/pages-tti-cache/pages-tti-sw.json
          if [ -f artifacts/pages-tti-warm-streak.json ]; then
            cp -f artifacts/pages-tti-warm-streak.json artifacts/pages-tti-cache/pages-tti-warm-streak.json
          fi

      - name: Save Pages TTI cache (next run trend)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: artifacts/pages-tti-cache
          key: pages-tti-prev-${{ github.run_id }}

      - name: Restore previous Pages stamp (cache)
        if: always()
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: artifacts/prev-stamp
          key: pages-live-stamp-${{ github.run_id }}
          restore-keys: |
            pages-live-stamp-

      - name: Record live Pages stamp + advisory roll
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          PAGES_URL: https://otas0.github.io/immspfee/
          PREV_STAMP_PATH: artifacts/prev-stamp/pages-live-stamp.json
        run: |
          mkdir -p artifacts
          npm run test:pages-stamp
          mkdir -p artifacts/stamp-cache
          cp -f artifacts/pages-live-stamp.json artifacts/stamp-cache/pages-live-stamp.json
          echo "pages stamp recorded" | tee -a artifacts/ci-summary.txt

      - name: Save Pages stamp cache (next run compare)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: artifacts/stamp-cache
          key: pages-live-stamp-${{ github.run_id }}

      - name: Pages mobile smoke (advisory)
        id: pages_mobile
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          PAGES_URL: https://otas0.github.io/immspfee/
        run: |
          npm run test:pages-mobile 2>&1 | tee artifacts/pages-mobile.log
          if [ -f artifacts/pages-mobile-smoke.json ]; then
            node -e "const j=require('./artifacts/pages-mobile-smoke.json'); console.log('pages-mobile advisory', (j.advisory||[]).join(' · ')||'(none)');" | tee -a artifacts/ci-summary.txt
          fi

      - name: Upload boot timing
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: boot-timing
          path: |
            artifacts/boot-timing.json
            artifacts/pages-tti-sw.json
            artifacts/pages-tti-trend.json
            artifacts/pages-network-summary.json
            artifacts/pages-live-stamp.json
            artifacts/pages-mobile-smoke.json
            artifacts/pages-mobile-stamp.json
            artifacts/pages-mobile.log
          if-no-files-found: ignore

      - name: Upload narrow-screen screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: narrow-screenshots
          path: shots/narrow-*.png
          if-no-files-found: ignore

      - name: Contract browser draw sample
        id: contract_browser
        run: npm run test:contract-browser
        continue-on-error: true

      - name: Regenerate low-ink table (gen:low-ink)
        id: gen_low_ink
        if: always() && hashFiles('artifacts/contract-browser.json') != ''
        run: |
          npm run gen:low-ink
          if git diff --quiet -- data/principle-low-ink.json js/lab/lowInkIds.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "low-ink table unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- data/principle-low-ink.json js/lab/lowInkIds.js > artifacts/low-ink-table.diff || true
            echo "low-ink table drifted — see artifacts/low-ink-table.diff"
          fi
        continue-on-error: true

      - name: Assert keptLogicGates on tighten dry-run
        if: always() && hashFiles('artifacts/contract-browser.json') != ''
        run: npm run gen:low-ink:assert-keep

      - name: Assert prepare-site docsAssets stamp
        run: |
          node scripts/prepare-site.mjs _site-ci-stamp
          node -e "
            const s=require('./_site-ci-stamp/asset-stamp.json');
            if (!s.docsAssets) { console.error('missing docsAssets', s); process.exit(1); }
            const html=require('fs').readFileSync('./_site-ci-stamp/manual.html','utf8');
            if (!html.includes('?v='+s.docsAssets)) {
              console.error('manual.html missing docsAssets ?v=', s.docsAssets);
              process.exit(1);
            }
            console.log('docsAssets ok', s.docsAssets);
          "

      - name: Upload contract-failed-ids on draw failure
        if: steps.contract_browser.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: contract-failed-ids
          path: |
            artifacts/contract-failed-ids.txt
            artifacts/contract-browser.json
          if-no-files-found: warn

      - name: Upload low-ink table diff
        if: steps.gen_low_ink.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: low-ink-table-diff
          path: |
            artifacts/low-ink-table.diff
            data/principle-low-ink.json
            js/lab/lowInkIds.js
          if-no-files-found: warn

      - name: Comment PR with schema + principle-ink summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let schemaLine = 'schema coverage: (missing artifacts/schema-coverage.json)';
            try {
              const j = JSON.parse(fs.readFileSync('artifacts/schema-coverage.json', 'utf8'));
              const c = j.coverage || {};
              schemaLine = `schema ${c.schema?.pct ?? '?'}% · zh-label ${c.zhOrSymbolLabel?.pct ?? '?'}% · unit ${c.unit?.pct ?? '?'}% · models ${j.models ?? '?'}`;
            } catch {}
            let inkLine = 'principle-ink: (missing artifacts/principle-ink.md)';
            let inkWarn = false;
            try {
              const md = fs.readFileSync('artifacts/principle-ink.md', 'utf8');
              const mean = (md.match(/mean:\s*([^\n]+)/i) || [])[1]?.trim();
              const min = (md.match(/min:\s*([^\n]+)/i) || [])[1]?.trim();
              const n = (md.match(/n:\s*([^\n]+)/i) || [])[1]?.trim();
              const sparse = (md.match(/sparse[^:]*:\s*([^\n]+)/i) || [])[1]?.trim();
              const gate = (md.match(/gate:\s*([^\n]+)/i) || [])[1]?.trim();
              const unreg = (md.match(/low-ink unregistered:\s*([^\n]+)/i) || [])[1]?.trim();
              inkLine = `principle-ink n=${n || '?'} mean=${mean || '?'} min=${min || '?'}`
                + (sparse && sparse !== '—' ? ` sparse=${sparse}` : '')
                + (gate ? ` · gate=${gate}` : '');
              const minPct = parseFloat(String(min || '').replace('%', ''));
              inkWarn = Number.isFinite(minPct) && minPct < 1;
              if (unreg && unreg !== '—') inkLine += ` · unregistered=${unreg}`;
            } catch {}
            const shellOk = process.env.SHELL_CHROME_OK === 'true';
            const shellLine = shellOk
              ? 'shell chrome ok · microscope exclusive chrome / optical rail / 390 layout'
              : 'shell chrome FAILED — exclusive microscope enter/leave or chrome regression';
            const lines = [
              '### Lab CI summary',
              '',
              schemaLine,
              inkWarn ? `⚠️ ${inkLine}` : inkLine,
              shellOk ? shellLine : `⚠️ ${shellLine}`,
            ];
            if (process.env.LOW_INK_CHANGED === 'true') {
              lines.push('', '_low-ink table drifted — artifact `low-ink-table-diff`；本地可 `npm run gen:low-ink` 后提交_');
              try {
                const diff = fs.readFileSync('artifacts/low-ink-table.diff', 'utf8').trim();
                if (diff) lines.push('```diff', diff.slice(0, 3500), '```');
              } catch {}
            }
            if (process.env.CONTRACT_FAILED === 'true') {
              let ids = '(no artifacts/contract-failed-ids.txt)';
              try {
                ids = fs.readFileSync('artifacts/contract-failed-ids.txt', 'utf8').trim() || '(empty)';
              } catch {}
              lines.push('', '**Contract browser failed**', '```', ids, '```');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });
        env:
          CONTRACT_FAILED: ${{ steps.contract_browser.outcome == 'failure' }}
          LOW_INK_CHANGED: ${{ steps.gen_low_ink.outputs.changed }}
          SHELL_CHROME_OK: ${{ steps.shell_chrome.outputs.ok }}

      - name: Fail job if contract-browser failed
        if: steps.contract_browser.outcome == 'failure'
        run: |
          mkdir -p artifacts
          {
            echo "contract-browser failed"
            if [ -f artifacts/contract-failed-ids.txt ]; then
              echo "failed-ids:"
              cat artifacts/contract-failed-ids.txt
            fi
            if [ -f artifacts/principle-ink.md ]; then
              unreg=$(sed -n 's/^- low-ink unregistered: //p' artifacts/principle-ink.md | head -1)
              echo "low-ink unregistered: ${unreg:-—}"
              echo "low-ink unregistered: ${unreg:-—}" >> artifacts/ci-summary.txt
            fi
            if [ -f artifacts/contract-browser.json ]; then
              node -e "const j=require('./artifacts/contract-browser.json'); const u=(j.inkGate&&j.inkGate.unregistered)||[]; console.log('inkGate.unregistered='+(u.join(',')||'—'));"
            fi
          } | tee -a artifacts/ci-summary.txt
          exit 1

      # low-ink auto-PR removed: GITHUB_TOKEN cannot push chore/low-ink-table-sync (403).
      # When gen:low-ink drifts, upload artifact above and commit the table on main locally.

      - name: Visual baseline
        run: npm run test:visual

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diffs
          path: shots/diff/
          if-no-files-found: ignore

      - name: Upload contract / schema artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lab-artifacts
          path: |
            artifacts/
          if-no-files-found: ignore

  webkit-gate:
    name: webkit-gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            micro:
              - 'scripts/micro-**'
              - 'scripts/shell-chrome.mjs'
              - 'js/viz/microscope**'
              - 'js/shells/microscope**'
              - 'js/models/microscope**'
              - 'js/models/compoundMicroscope.js'
              - 'css/microscope-shell.css'
      - name: Decide WebKit job
        id: check
        run: |
          run=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then run=true; fi
          msg='${{ github.event.head_commit.message }}'
          if printf '%s' "$msg" | grep -q '\[webkit\]'; then run=true; fi
          if [ "${{ steps.filter.outputs.micro }}" = "true" ]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "webkit-gate run=$run filter=${{ steps.filter.outputs.micro }}"

  webkit-projector:
    name: webkit-projector (optional)
    needs: webkit-gate
    if: needs.webkit-gate.outputs.run == 'true'
    # Ubuntu WebKit apt deps frequently fail (exit 100); macOS ships a usable WebKit binary.
    # Prefer macos-latest: macos-14 can cancel instantly with
    # "configuration 'macos-14-arm64-us-default' is not supported" on this repo.
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright WebKit
        timeout-minutes: 10
        run: npx playwright install webkit
      - name: Start lab server
        run: |
          npm run build:bundle
          node scripts/dev-server.mjs &
          sleep 2
      - name: WebKit projector overlay
        env:
          SHELL_WEBKIT_ONLY: '1'
        run: node scripts/shell-chrome.mjs
      - name: WebKit magenta activity-ring ROI
        env:
          MICRO_BROWSER: webkit
        run: |
          npm run test:micro-magenta
          npm run test:micro-magenta:390
      - name: WebKit oil blend (1280 + 390 getOilScreen)
        env:
          MICRO_BROWSER: webkit
        run: |
          npm run test:micro-oil
          npm run test:micro-oil:390
      - name: WebKit camera contract (WASD / blur / presets / hover)
        env:
          MICRO_BROWSER: webkit
          VIEWPORT: 390x844
        run: npm run test:micro-camera
      - name: WebKit microscope promo shots
        env:
          MICRO_BROWSER: webkit
        run: npm run test:micro-shots
      - name: Promo still drift check
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          if ! git diff --exit-code -- docs/promo; then
            echo "DRIFTED=1 promo stills changed by test:micro-shots"
            git diff --stat -- docs/promo | tee artifacts/promo-drift.txt
            TITLE='webkit: docs/promo drifted — commit micro-shots sync'
            EXISTING=$(gh issue list -R "${{ github.repository }}" --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
            BODY_FILE="${RUNNER_TEMP}/promo-drift.md"
            {
              echo "Promo PNGs drifted on run ${{ github.run_id }} (SHA \`${{ github.sha }}\`)."
              echo
              echo 'Reproduce / commit:'
              echo
              echo '```bash'
              echo 'git diff --exit-code docs/promo'
              echo 'MICRO_BROWSER=webkit npm run test:micro-shots'
              echo "git add docs/promo && git commit -m 'chore(webkit): sync micro promo stills' && git push"
              echo '```'
            } > "$BODY_FILE"
            if [ -n "$EXISTING" ]; then
              gh issue comment -R "${{ github.repository }}" "$EXISTING" --body-file "$BODY_FILE" || true
            else
              gh issue create -R "${{ github.repository }}" --title "$TITLE" --body-file "$BODY_FILE" || true
            fi
            echo "promo drift issue opened/commented" >> artifacts/ci-summary.txt
          else
            echo "promo stills unchanged" | tee -a artifacts/ci-summary.txt
          fi
      - name: Sync safari-proxy + shell menu docs shots when drifted
        if: always()
        id: safari_proxy
        run: |
          set -o pipefail
          OUT=$(node scripts/sync-safari-proxy-asset.mjs | tee /dev/stderr)
          OUT2=$(npm run sync:shell-docs 2>&1 | tee /dev/stderr)
          echo "$OUT" | grep -q 'DRIFTED=1' && echo "drifted=1" >> "$GITHUB_OUTPUT" || echo "drifted=0" >> "$GITHUB_OUTPUT"
          echo "$OUT2" | grep -q 'DRIFTED=1' && echo "shell_docs_drifted=1" >> "$GITHUB_OUTPUT" || echo "shell_docs_drifted=0" >> "$GITHUB_OUTPUT"
      - name: Open / comment safari-proxy drift issue
        if: always() && steps.safari_proxy.outputs.drifted == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE='webkit: docs/assets safari-proxy drifted — commit sync (no bot push)'
          BODY_FILE="${RUNNER_TEMP}/webkit-safari-proxy-drift.md"
          {
            echo 'WebKit job wrote a new `shots/shell-projector-1000-safari-proxy.png` and synced'
            echo '`docs/assets/shell-projector-1000-safari-proxy.png` locally in CI, but the workflow'
            echo '**cannot push** to `main`.'
            echo
            echo '**Commit reminder (human / agent with push):**'
            echo
            echo '```bash'
            echo 'npm run sync:safari-proxy'
            echo 'npm run sync:shell-docs'
            echo 'git add docs/assets/shell-projector-1000-safari-proxy.png docs/assets/shell-projector-1000-menu.png docs/assets/shell-micro-menu-390-webkit.png'
            echo 'git commit -m "chore(webkit): sync safari-proxy + shell menu docs shots"'
            echo 'git push origin HEAD'
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "SHA: \`${{ github.sha }}\`"
            echo "Artifact: \`webkit-safari-proxy-${{ github.sha }}\`"
          } > "$BODY_FILE"
          EXISTING=$(gh issue list --state open --search "webkit: docs/assets safari-proxy drifted in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
            echo "Commented on #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: webkit-safari-proxy-${{ github.sha }}
          path: |
            shots/shell-projector-1000-safari-proxy.png
            shots/shell-micro-390-webkit.png
            shots/shell-micro-menu-390-webkit.png
            docs/assets/shell-projector-1000-safari-proxy.png
            docs/assets/shell-projector-1000-menu.png
            docs/assets/shell-micro-menu-390-webkit.png
          if-no-files-found: warn

  shots-extra:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Start lab server
        run: |
          node scripts/dev-server.mjs &
          sleep 2
      - run: npm run shots:extra
      - uses: actions/upload-artifact@v6
        with:
          name: shots-extra
          path: shots/extra/
          if-no-files-found: ignore
